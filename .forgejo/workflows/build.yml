# Forgejo Actions：打包 Android（Linux runner）与 Windows（Windows runner）
#
# ── 为什么分成两类 runner ──────────────────────────────────────────────
# **Flutter 的 Windows 桌面产物只能在 Windows 上构建**（官方不支持交叉编译），
# 而 Android APK 在 Linux 上完全没问题。所以：
#   * `verify` / `android` → `runs-on: ubuntu-latest`（用你现有的 Docker/Linux runner 即可）
#   * `windows`            → `runs-on: windows`（需要一台 Windows 自托管 runner）
#
# **Windows 那个 job 默认不跑**：仓库变量 `WINDOWS_RUNNER=true` 才会执行，
# 免得还没注册 Windows runner 时它一直挂在队列里。注册步骤见 docs/ci.md §2；
# 不想折腾 runner 的话，Windows 包用本机脚本 `tools\build_release.ps1 -Platform windows` 出。
#
# ── 产物 ──────────────────────────────────────────────────────────────
#   * android-apk : ws_scrcpy_client-<版本>.apk（universal；手动触发可按 ABI 拆分）
#   * windows-x64 : ws_scrcpy_client-<版本>-windows-x64.zip（解压即用）
#
# 版本号：打 tag（v1.2.3）时用 tag 名做 --build-name、run number 做 build 号；
# 普通分支推送沿用 pubspec.yaml 的 1.0.0+1。
name: build

on:
  # ① MR 合并进 master → 这次推送触发一次构建（产物来自 master）
  push:
    branches: [master]
    tags: ['v*']
  # ② MR 的源分支有新提交（synchronize）/ 新开 / 重开 / 从草稿转正式 → 触发
  #    只对"目标分支是 master"的 MR 生效；同一 MR 上的新提交会用 concurrency 取消上一次
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  workflow_dispatch:
    inputs:
      split_abi:
        description: 'Android 按 ABI 拆分 APK（armeabi-v7a / arm64-v8a / x86_64）'
        type: boolean
        default: false

concurrency:
  group: build-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 静态检查 + 单测（与平台无关，跑在 Linux 上最快）────────────────────
  verify:
    name: 静态检查与单测
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Flutter（版本与 AGENTS.md §2 对齐）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: 工具链版本
        run: flutter --version

      - name: 依赖
        run: flutter pub get

      - name: 静态检查
        run: dart analyze lib test tools

      - name: 单测
        run: flutter test

  # ── 2. Android APK（Linux runner）────────────────────────────────────
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 90
    env:
      REF_NAME: ${{ forgejo.ref_name }}
      RUN_NUMBER: ${{ forgejo.run_number }}
      SPLIT_ABI: ${{ inputs.split_abi }}
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 JDK 17（Gradle 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: 装 Android SDK（cmdline-tools + 平台/构建工具）
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 接受 SDK 许可（Gradle 缺组件时会自动补装，但需要先有许可）
        continue-on-error: true
        run: yes | flutter doctor --android-licenses || true

      - name: 环境体检（失败不拦，只作参考）
        continue-on-error: true
        run: flutter doctor -v

      - name: 构建 APK（Release）
        run: |
          set -e
          EXTRA=""
          if [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            NAME="${REF_NAME#v}"
            EXTRA="--build-name=$NAME --build-number=$RUN_NUMBER"
            echo "按 tag 注入版本：$NAME+$RUN_NUMBER"
          fi
          flutter pub get
          if [ "$SPLIT_ABI" = "true" ]; then
            echo "按 ABI 拆分打包"
            flutter build apk --release --split-per-abi $EXTRA
          else
            echo "打 universal APK（一份装所有架构，含 redroid 用的 x86_64）"
            flutter build apk --release $EXTRA
          fi

      - name: 整理产物（带上版本号）
        run: |
          set -e
          NAME="dev"
          if [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then NAME="${REF_NAME#v}"; fi
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$apk" .apk)
            abi="${base#app-}"; abi="${abi%-release}"
            suffix=""; [ "$abi" != "release" ] && suffix="-$abi"
            cp "$apk" "dist/ws_scrcpy_client-$NAME$suffix.apk"
          done
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  # ── 3. Windows 桌面端（需要 Windows runner；用仓库变量开关）────────────
  windows:
    name: Windows 桌面（x64）
    # 没注册 Windows runner 之前不跑，避免任务一直排队。
    # 在 仓库 → Settings → Actions → Variables 里加 WINDOWS_RUNNER=true 即启用。
    if: ${{ vars.WINDOWS_RUNNER == 'true' }}
    runs-on: windows
    needs: verify
    timeout-minutes: 90
    defaults:
      run:
        # 用 Windows 自带的 powershell(5.1)，不要写 pwsh：
        # pwsh(PowerShell 7) 未必装在 runner 机器上，而 5.1 每台 Windows 都有。
        # 也因此，下面 run: 里的提示文字一律用英文——5.1 读无 BOM 的 UTF-8 脚本会把中文变乱码。
        shell: powershell
    env:
      REF_NAME: ${{ forgejo.ref_name }}
      RUN_NUMBER: ${{ forgejo.run_number }}
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 工具链版本（日志里要能看出用的哪套）
        run: |
          flutter --version
          dart --version

      - name: 原生依赖（WebView2 / WIL）
        # CI 的干净 checkout 没有本机 NuGet 缓存 → -Online 从 nuget.org 取；
        # 包落到 .tmp\nuget-source\ 后，构建期 tools\nuget_shim.cmd 会自己解包，
        # 所以这里连 nuget.exe 都不需要。
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\prepare_windows_deps.ps1 -Online

      - name: 构建（Release）
        run: |
          $extra = @()
          if ($env:REF_NAME -match '^v?\d+\.\d+\.\d+') {
            $name = $env:REF_NAME -replace '^v', ''
            $extra += "--build-name=$name"
            $extra += "--build-number=$env:RUN_NUMBER"
            Write-Host "version from tag: $name+$env:RUN_NUMBER"
          } else {
            Write-Host "not a tag push: use version from pubspec.yaml"
          }
          flutter pub get
          flutter build windows --release @extra

      - name: 打包 zip
        run: |
          $src = 'build\windows\x64\runner\Release'
          if (-not (Test-Path $src)) { throw "build output missing: $src" }
          $ver = if ($env:REF_NAME -match '^v?\d+\.\d+\.\d+') { $env:REF_NAME -replace '^v', '' } else { 'dev' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist\ws_scrcpy_client-$ver-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "packed: $zip ($mb MB)"

      - name: 上传产物
        uses: actions/upload-artifact@v3
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ── 附：自动发 Release？先配好 token 再取消注释 ────────────────────────
  # Forgejo 不像 GitHub 那样自带 secrets.GITHUB_TOKEN，需要在
  # 仓库 Settings → Actions → Secrets 加一个具名 token（写权限），
  # 然后把 `token:` 指到它（详见 docs/ci.md §8）。
