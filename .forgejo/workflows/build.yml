# Forgejo Actions（★ 当前在用的 CI）：打包 Android / web / Windows
#
# > 另有一份 GitHub Actions 工作流 `.github/workflows/build.yml`，但它**默认只手动触发**
# > —— GitHub 私有仓库的 Actions 分钟数要吃免费额度，本仓库改用自托管 Forgejo runner。
# > 什么时候想切回去见 docs/ci.md §9。
#>
#> ★ runner 的标签映射（在 runner 那台机器的 docker-compose 里）：
#>   `--label docker:docker://data.forgejo.org/oci/node:20-bookworm`        ← 好的
#>   `--label ubuntu-latest:docker://data.forgejo.org/oci/ubuntu:24.04`    ← ★ 坏的：
#>     Forgejo 那个 OCI registry **没有 ubuntu 这个仓库**（实测 NAME_UNKNOWN），
#>     所以 `runs-on: ubuntu-latest` 的 job 一律在 Set up job 阶段就失败。
#>   **本工作流采用方案 ②**：三个 Linux job 都写 `runs-on: docker`（那个标签指向
#>   `oci/node:20-bookworm`，实测 manifest 200 可拉）。等你把 runner 的
#>   `ubuntu-latest` 那行也改成 `oci/node:20-bookworm`（见 docs/ci.md §2.1），
#>   再改回 `runs-on: ubuntu-latest` 即可 —— 两种写法的环境完全一样。
#
# ── 为什么分成两类 runner ──────────────────────────────────────────────
# **Flutter 的 Windows 桌面产物只能在 Windows 上构建**（官方不支持交叉编译），
# 而 Android APK 与 web 在 Linux 上完全没问题。所以：
#   * `verify` / `android` / `web` → `runs-on: docker`（你现有 Linux runner 的 `docker` 标签；
#     为什么不是 `ubuntu-latest` 见本文件开头的标签映射说明）
#   * `windows`                   → `runs-on: windows`（需要一台 Windows 自托管 runner）
#
# **Apple 两端（iOS / macOS）不在 CI 里**：那需要 macOS runner，自托管一台 Mac 只为构建不划算
# （iOS 还要签名）。Apple 包本机出：`flutter build ios --no-codesign` / `flutter build macos`。
#
# **Windows 那个 job 默认不跑**：仓库变量 `WINDOWS_RUNNER=true` 才会执行，
# 免得还没注册 Windows runner 时它一直挂在队列里。注册步骤见 docs/ci.md §2；
# 不想折腾 runner 的话，Windows 包用本机脚本 `tools\build_release.ps1 -Platform windows` 出。
#
# ── 产物 ──────────────────────────────────────────────────────────────
#   * android-apk : ws_scrcpy_client-<版本>.apk（universal；手动触发可按 ABI 拆分）
#   * web-dist    : ws_scrcpy_client-<版本>-web.zip（静态站点，可挂到服务端同源下）
#   * windows-x64 : ws_scrcpy_client-<版本>-windows-x64.zip（解压即用）
#
# 版本号：打 tag（v1.2.3）时用 tag 名做 --build-name、run number 做 build 号；
# 普通分支推送沿用 pubspec.yaml 的 1.0.0+1。
name: build

on:
  # ① MR 合并进 master → 这次推送触发一次构建（产物来自 master）
  push:
    branches: [master]
    tags: ['v*']
  # ② MR 的源分支有新提交（synchronize）/ 新开 / 重开 / 从草稿转正式 → 触发
  #    只对"目标分支是 master"的 MR 生效；同一 MR 上的新提交会用 concurrency 取消上一次
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  workflow_dispatch:
    inputs:
      split_abi:
        description: 'Android 按 ABI 拆分 APK（armeabi-v7a / arm64-v8a / x86_64）'
        type: boolean
        default: false

concurrency:
  group: build-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  # 与 AGENTS.md §2 对齐；升级 Flutter 时改这里 + pubspec 的 sdk 约束。
  FLUTTER_VERSION: '3.47.1'
  # ★ 宿主机挂进来的 CI 资源目录（Flutter / Android SDK / Gradle 与 pub 缓存）。
  #   由 tools/prepare_ci_host.sh 一次性准备、runner 用 container.options 挂进 job 容器
  #   （见 docs/ci.md §2.4）。**挂上了就一个字节都不用下**；没挂就自动回退到下载，
  #   所以在别的 runner / 本地跑也不会坏。
  CI_HOST_DIR: /opt/dev

jobs:
  # ── 1. 静态检查 + 单测（与平台无关，跑在 Linux 上最快）────────────────────
  verify:
    name: 静态检查与单测
    # ★ 不用 ubuntu-latest：runner 把那个标签映射到了**不存在**的仓库
    #   `data.forgejo.org/oci/ubuntu`（实测 NAME_UNKNOWN），job 会在 Set up job 就死。
    #   `docker` 标签映射的是 `oci/node:20-bookworm`（实测 200 可拉）——环境一样是
    #   Debian + node，Flutter/JDK/Android SDK 都由工作流自己装。
    runs-on: docker
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 基础工具（镜像里未必带 xz/zip/unzip）
        run: |
          set -e
          if ! command -v xz >/dev/null 2>&1 || ! command -v zip >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq xz-utils zip unzip
          fi

      - name: 缓存目录（挂载可用时，Gradle/pub 依赖也不用每次重下）
        run: |
          set -e
          # 先把"挂载到底有没有生效"打到日志里 —— 排查这类问题不该靠猜（见 docs/ci.md §2.4）
          echo "CI_HOST_DIR=$CI_HOST_DIR"
          ls -la "$CI_HOST_DIR" 2>&1 | head -12 || true
          if [ -x "$CI_HOST_DIR/flutter/bin/flutter" ]; then
            echo "✓ 挂载里能找到 $CI_HOST_DIR/flutter"
          else
            echo "✗ 挂载里没有 flutter —— 会回退到下载（检查 dind 的 volume 与 container.options）"
          fi
          # ★ 必须先判断 $CI_HOST_DIR **本来就存在**（= 挂载生效）：只 mkdir 的话，
          #   没挂载时容器里也能凭空建出 /opt/dev（root 可写），于是会误报"缓存走挂载目录"。
          if [ -d "$CI_HOST_DIR" ] && mkdir -p "$CI_HOST_DIR/gradle-home" "$CI_HOST_DIR/pub-cache" 2>/dev/null; then
            echo "GRADLE_USER_HOME=$CI_HOST_DIR/gradle-home" >> "$GITHUB_ENV"
            echo "PUB_CACHE=$CI_HOST_DIR/pub-cache" >> "$GITHUB_ENV"
            echo "缓存走挂载目录：$CI_HOST_DIR"
          else
            echo "没有可写的 $CI_HOST_DIR（未挂载？）→ 缓存留在容器内，每次重下"
          fi

      - name: 装 Flutter（优先用宿主机挂进来的，没有才下载）
        # 宿主机准备见 tools/prepare_ci_host.sh：$CI_HOST_DIR/flutter 存在就直接用
        # （省掉每个 job 重下 ~1GB）；不存在才回退到官方 tar.xz。
        run: |
          set -e
          FLUTTER_HOME=""
          for candidate in "$CI_HOST_DIR/flutter" "$HOME/flutter"; do
            if [ -x "$candidate/bin/flutter" ]; then
              FLUTTER_HOME="$candidate"
              echo "用已存在的 Flutter：$candidate"
              break
            fi
          done
          if [ -z "$FLUTTER_HOME" ]; then
            FLUTTER_HOME="$HOME/flutter"
            URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            echo "下载 $URL"
            curl -fSL --retry 3 --retry-delay 2 -o /tmp/flutter.tar.xz "$URL"
            tar -xJf /tmp/flutter.tar.xz -C "$(dirname "$FLUTTER_HOME")"
            rm -f /tmp/flutter.tar.xz
          fi
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$FLUTTER_HOME/bin:$PATH"
          # 容器里以 root 跑，Flutter 会抱怨 git 的 dubious ownership
          git config --global --add safe.directory "$FLUTTER_HOME"
          flutter --version

      - name: 工具链版本
        run: flutter --version

      - name: 依赖
        run: flutter pub get

      - name: 静态检查
        run: dart analyze lib test tools

      - name: 单测
        run: flutter test

  # ── 2. Android APK（Linux runner）────────────────────────────────────
  android:
    name: Android APK
    # ★ 不用 ubuntu-latest：runner 把那个标签映射到了**不存在**的仓库
    #   `data.forgejo.org/oci/ubuntu`（实测 NAME_UNKNOWN），job 会在 Set up job 就死。
    #   `docker` 标签映射的是 `oci/node:20-bookworm`（实测 200 可拉）——环境一样是
    #   Debian + node，Flutter/JDK/Android SDK 都由工作流自己装。
    runs-on: docker
    needs: verify
    timeout-minutes: 90
    env:
      REF_NAME: ${{ forgejo.ref_name }}
      RUN_NUMBER: ${{ forgejo.run_number }}
      SPLIT_ABI: ${{ inputs.split_abi }}
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 基础工具（镜像里未必带 zip/unzip/xz）
        # job 容器用的是 node:*-bookworm 这类镜像，别假设它带这些：
        #   xz  → 解压 Flutter 的 tar.xz；
        #   zip → web 那步打包；
        #   unzip → Android SDK 的 zip 包。
        run: |
          set -e
          if ! command -v xz >/dev/null 2>&1 || ! command -v zip >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq xz-utils zip unzip
          fi

      - name: 装 JDK 17（优先用宿主机挂进来的，没有才下）
        # Gradle/AGP 自己要一个 JVM 才能跑，而 oci/node:20-bookworm 里没有 JDK ——
        # 不装的话 `flutter build apk` 第一步就报 "Unable to locate a Java Runtime"。
        # 原来用 actions/setup-java@v4：它每次都从 api.adoptium.net → github releases
        # 下 ~190MB Temurin（实测 1m28s，而且工具缓存落在临时容器里，下个 job 还得再下）。
        # 现在优先用挂载目录里的 $CI_HOST_DIR/jdk（见 tools/prepare_ci_host.sh）。
        # 回退路径用 Adoptium 的 "latest" 重定向地址，不需要 jq/python 解析 JSON。
        run: |
          set -e
          if [ -x "$CI_HOST_DIR/jdk/bin/java" ]; then
            JAVA_HOME="$CI_HOST_DIR/jdk"
            echo "用已存在的 JDK：$JAVA_HOME"
          else
            JAVA_HOME=/opt/jdk
            echo "下载 Temurin 17（~190MB）…"
            curl -fSL --retry 3 --retry-delay 2 -o /tmp/jdk.tar.gz \
              "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse"
            mkdir -p "$JAVA_HOME"
            tar -xzf /tmp/jdk.tar.gz -C "$JAVA_HOME" --strip-components=1
            rm -f /tmp/jdk.tar.gz
          fi
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version

      - name: 缓存目录（挂载可用时，Gradle/pub 依赖也不用每次重下）
        run: |
          set -e
          if mkdir -p "$CI_HOST_DIR/gradle-home" "$CI_HOST_DIR/pub-cache" 2>/dev/null; then
            echo "GRADLE_USER_HOME=$CI_HOST_DIR/gradle-home" >> "$GITHUB_ENV"
            echo "PUB_CACHE=$CI_HOST_DIR/pub-cache" >> "$GITHUB_ENV"
            echo "缓存走挂载目录：$CI_HOST_DIR"
          else
            echo "没有可写的 $CI_HOST_DIR（未挂载？）→ 缓存留在容器内，每次重下"
          fi

      - name: 装 Flutter（优先用宿主机挂进来的，没有才下载）
        # 宿主机准备见 tools/prepare_ci_host.sh：$CI_HOST_DIR/flutter 存在就直接用
        # （省掉每个 job 重下 ~1GB）；不存在才回退到官方 tar.xz。
        run: |
          set -e
          FLUTTER_HOME=""
          for candidate in "$CI_HOST_DIR/flutter" "$HOME/flutter"; do
            if [ -x "$candidate/bin/flutter" ]; then
              FLUTTER_HOME="$candidate"
              echo "用已存在的 Flutter：$candidate"
              break
            fi
          done
          if [ -z "$FLUTTER_HOME" ]; then
            FLUTTER_HOME="$HOME/flutter"
            URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            echo "下载 $URL"
            curl -fSL --retry 3 --retry-delay 2 -o /tmp/flutter.tar.xz "$URL"
            tar -xJf /tmp/flutter.tar.xz -C "$(dirname "$FLUTTER_HOME")"
            rm -f /tmp/flutter.tar.xz
          fi
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$FLUTTER_HOME/bin:$PATH"
          # 容器里以 root 跑，Flutter 会抱怨 git 的 dubious ownership
          git config --global --add safe.directory "$FLUTTER_HOME"
          flutter --version

      - name: 装 Android SDK（★ 走腾讯镜像：这台机器连不上 dl.google.com）
        # 实测（2026-10-07，lingke）：github.com / api.adoptium.net / repo.maven.apache.org 都通，
        # **只有 dl.google.com 不通（curl 返回 000）** —— 而它既是 Android SDK 的下载站，
        # 也是 Google Maven 的站（AGP/AndroidX 依赖在上面）。所以：
        #   ① SDK 组件改成从腾讯镜像直接取 zip（不用 sdkmanager，免得它去 dl.google.com）；
        #   ② Gradle 仓库在下一步换成阿里云镜像。
        # 文件名取自 Google 官方索引 repository2-3.xml —— **build-tools 从 35 起把 `-` 换成了 `_`**
        # （`build-tools_r36_linux.zip`），照旧名字写会 404。
        # 版本对应：compileSdk 36（Flutter 3.47 默认）+ build-tools 36.0.0。
        run: |
          set -e
          if [ -d "$CI_HOST_DIR/android-sdk/platforms/android-36" ]; then
            SDK="$CI_HOST_DIR/android-sdk"
            echo "用已存在的 Android SDK：$SDK"
          else
            SDK="$HOME/android-sdk"
          fi
          BASE="https://mirrors.cloud.tencent.com/AndroidSDK"
          mkdir -p "$SDK/platforms" "$SDK/build-tools" "$SDK/licenses"

          # ★ 故意**不装 cmdline-tools**（没有 sdkmanager）：
          #   flutter_tools/lib/src/android/gradle.dart 只在"SDK 里有可用的 sdkmanager"时
          #   才传 `-Pflutter.sdkManagerPath=…`，而 FlutterPluginUtils.forceNdkDownload
          #   看到这个属性就会**真的去调 sdkmanager 装 NDK** —— 实测那个 sdkmanager
          #   （cmdline-tools 16111833）是个壳，会先去 dl.google.com 下新的 Android CLI：
          #     Downloading Android CLI... Failed to download from
          #     https://dl.google.com/android/cli/latest/linux_x86_64/android-cli
          #   → 构建直接挂。我们不需要 NDK、也不需要 sdkmanager（包是自己解压装的、
          #   许可是自己写的），所以留空反而走 Flutter 的 synthetic external native build 兜底。
          fetch() { curl -fSL --retry 3 --retry-delay 2 -o /tmp/pkg.zip "$BASE/$1"; }
          unpack_to() {
            rm -rf /tmp/unpack && mkdir -p /tmp/unpack
            unzip -q /tmp/pkg.zip -d /tmp/unpack
            mv "$(find /tmp/unpack -mindepth 1 -maxdepth 1 | head -1)" "$1"
          }

          [ -d "$SDK/platforms/android-36" ]          || { fetch platform-36_r02.zip && unpack_to "$SDK/platforms/android-36"; }
          [ -d "$SDK/build-tools/36.0.0" ]            || { fetch build-tools_r36_linux.zip && unpack_to "$SDK/build-tools/36.0.0"; }
          [ -d "$SDK/platform-tools" ]                || { fetch platform-tools_r37.0.1-linux.zip && unpack_to "$SDK/platform-tools"; }

          # 许可文件：不写的话 AGP 认为许可没接受，直接拒绝构建
          printf '%s\n' \
            8933bad161af4178b1185d1a37fbf41ea5269c55 \
            d56f5187479451eabf01fb78af6dfcb131a6481e \
            24333f8a63b6825ea9c5514f83c2829b004d1fee > "$SDK/licenses/android-sdk-license"
          printf '%s\n' 84831b9409646a918e30573bab4c9c91346d8abd \
            > "$SDK/licenses/android-sdk-preview-license"

          # 防御：宿主机目录里若还有旧的 cmdline-tools（早期脚本装过），它会把上面那个坑带回来
          if [ -d "$SDK/cmdline-tools" ]; then
            echo "★ 发现 $SDK/cmdline-tools —— 它的 sdkmanager 会让 Flutter 去装 NDK 并撞 dl.google.com，删掉"
            rm -rf "$SDK/cmdline-tools" || echo "（删不掉，可能是只读挂载；请手动 rm -rf）"
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          du -sh "$SDK"
          ls "$SDK/platforms" "$SDK/build-tools" "$SDK/licenses"

      - name: Gradle 换阿里云镜像（Google Maven 在 dl.google.com 上，这台机器不通）
        # 写死 google() 的只有 4 个 .gradle.kts：项目 2 个 + Flutter gradle 插件 2 个
        # （后者在构建时会把仓库注入到 app 项目里）。全部换成阿里云镜像；
        # 末尾的 grep 是**门禁**：只要还剩一处 google() 就报错退出，免得它偷偷去连不通的站。
        run: |
          set -e
          GOOGLE_MIRROR='maven("https://maven.aliyun.com/repository/google")'
          PUBLIC_MIRROR='maven("https://maven.aliyun.com/repository/public")'
          PLUGIN_MIRROR='maven("https://maven.aliyun.com/repository/gradle-plugin")'
          FLUTTER_ROOT="${FLUTTER_ROOT:-$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")}"
          for f in android/build.gradle.kts android/settings.gradle.kts \
                   "$FLUTTER_ROOT/packages/flutter_tools/gradle/resolve_dependencies.gradle.kts" \
                   "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"; do
            [ -f "$f" ] || { echo "缺文件：$f"; exit 1; }
            sed -i "s|google()|$GOOGLE_MIRROR|g; s|mavenCentral()|$PUBLIC_MIRROR|g; s|gradlePluginPortal()|$PLUGIN_MIRROR|g" "$f"
          done
          if grep -rn "google()" android/ "$FLUTTER_ROOT/packages/flutter_tools/gradle/"; then
            echo "还有 google() 没换掉（上面那几行），它会去连不通的 dl.google.com"; exit 1
          fi
          grep -n "aliyun" android/settings.gradle.kts | head -3

      - name: 环境体检（失败不拦，只作参考）
        continue-on-error: true
        run: flutter doctor -v

      - name: 构建 APK（Release）
        run: |
          set -e
          EXTRA=""
          if [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            NAME="${REF_NAME#v}"
            EXTRA="--build-name=$NAME --build-number=$RUN_NUMBER"
            echo "按 tag 注入版本：$NAME+$RUN_NUMBER"
          fi
          flutter pub get
          if [ "$SPLIT_ABI" = "true" ]; then
            echo "按 ABI 拆分打包"
            flutter build apk --release --split-per-abi $EXTRA
          else
            echo "打 universal APK（一份装所有架构，含 redroid 用的 x86_64）"
            flutter build apk --release $EXTRA
          fi

      - name: 整理产物（带上版本号）
        run: |
          set -e
          NAME="dev"
          if [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then NAME="${REF_NAME#v}"; fi
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$apk" .apk)
            abi="${base#app-}"; abi="${abi%-release}"
            suffix=""; [ "$abi" != "release" ] && suffix="-$abi"
            cp "$apk" "dist/ws_scrcpy_client-$NAME$suffix.apk"
          done
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  # ── 3. web 静态站点（Linux runner 就能构建）────────────────────────────
  web:
    name: web 站点
    # ★ 不用 ubuntu-latest：runner 把那个标签映射到了**不存在**的仓库
    #   `data.forgejo.org/oci/ubuntu`（实测 NAME_UNKNOWN），job 会在 Set up job 就死。
    #   `docker` 标签映射的是 `oci/node:20-bookworm`（实测 200 可拉）——环境一样是
    #   Debian + node，Flutter/JDK/Android SDK 都由工作流自己装。
    runs-on: docker
    needs: verify
    timeout-minutes: 45
    env:
      REF_NAME: ${{ forgejo.ref_name }}
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 基础工具（镜像里未必带 zip/unzip/xz）
        # job 容器用的是 node:*-bookworm 这类镜像，别假设它带这些：
        #   xz  → 解压 Flutter 的 tar.xz；
        #   zip → web 那步打包；
        #   unzip → Android SDK 的 zip 包。
        run: |
          set -e
          if ! command -v xz >/dev/null 2>&1 || ! command -v zip >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq xz-utils zip unzip
          fi

      - name: 缓存目录（挂载可用时，Gradle/pub 依赖也不用每次重下）
        run: |
          set -e
          if mkdir -p "$CI_HOST_DIR/gradle-home" "$CI_HOST_DIR/pub-cache" 2>/dev/null; then
            echo "GRADLE_USER_HOME=$CI_HOST_DIR/gradle-home" >> "$GITHUB_ENV"
            echo "PUB_CACHE=$CI_HOST_DIR/pub-cache" >> "$GITHUB_ENV"
            echo "缓存走挂载目录：$CI_HOST_DIR"
          else
            echo "没有可写的 $CI_HOST_DIR（未挂载？）→ 缓存留在容器内，每次重下"
          fi

      - name: 装 Flutter（优先用宿主机挂进来的，没有才下载）
        # 宿主机准备见 tools/prepare_ci_host.sh：$CI_HOST_DIR/flutter 存在就直接用
        # （省掉每个 job 重下 ~1GB）；不存在才回退到官方 tar.xz。
        run: |
          set -e
          FLUTTER_HOME=""
          for candidate in "$CI_HOST_DIR/flutter" "$HOME/flutter"; do
            if [ -x "$candidate/bin/flutter" ]; then
              FLUTTER_HOME="$candidate"
              echo "用已存在的 Flutter：$candidate"
              break
            fi
          done
          if [ -z "$FLUTTER_HOME" ]; then
            FLUTTER_HOME="$HOME/flutter"
            URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            echo "下载 $URL"
            curl -fSL --retry 3 --retry-delay 2 -o /tmp/flutter.tar.xz "$URL"
            tar -xJf /tmp/flutter.tar.xz -C "$(dirname "$FLUTTER_HOME")"
            rm -f /tmp/flutter.tar.xz
          fi
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$FLUTTER_HOME/bin:$PATH"
          # 容器里以 root 跑，Flutter 会抱怨 git 的 dubious ownership
          git config --global --add safe.directory "$FLUTTER_HOME"
          flutter --version

      - name: 依赖
        run: flutter pub get

      # 脚本自带：① 从 pub 缓存准备 sqlite3.wasm + drift_worker.js（不进仓库）
      # ② `--no-web-resources-cdn`（否则离线环境永远白屏，见 AGENTS §9.3）
      - name: 构建 web
        run: tools/build_web.sh

      - name: 打包 zip
        run: |
          set -e
          NAME="dev"
          if [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then NAME="${REF_NAME#v}"; fi
          mkdir -p dist
          (cd build/web && zip -qr "../../dist/ws_scrcpy_client-$NAME-web.zip" .)
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v3
        with:
          name: web-dist
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ── 4. Windows 桌面端（需要 Windows runner；用仓库变量开关）────────────
  windows:
    name: Windows 桌面（x64）
    # 没注册 Windows runner 之前不跑，避免任务一直排队。
    # 在 仓库 → Settings → Actions → Variables 里加 WINDOWS_RUNNER=true 即启用。
    if: ${{ vars.WINDOWS_RUNNER == 'true' }}
    runs-on: windows
    needs: verify
    timeout-minutes: 90
    defaults:
      run:
        # 用 Windows 自带的 powershell(5.1)，不要写 pwsh：
        # pwsh(PowerShell 7) 未必装在 runner 机器上，而 5.1 每台 Windows 都有。
        # 也因此，下面 run: 里的提示文字一律用英文——5.1 读无 BOM 的 UTF-8 脚本会把中文变乱码。
        shell: powershell
    env:
      REF_NAME: ${{ forgejo.ref_name }}
      RUN_NUMBER: ${{ forgejo.run_number }}
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 工具链版本（日志里要能看出用的哪套）
        run: |
          flutter --version
          dart --version

      - name: 原生依赖（WebView2 / WIL）
        # CI 的干净 checkout 没有本机 NuGet 缓存 → -Online 从 nuget.org 取；
        # 包落到 .tmp\nuget-source\ 后，构建期 tools\nuget_shim.cmd 会自己解包，
        # 所以这里连 nuget.exe 都不需要。
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\prepare_windows_deps.ps1 -Online

      - name: 构建（Release）
        run: |
          $extra = @()
          if ($env:REF_NAME -match '^v?\d+\.\d+\.\d+') {
            $name = $env:REF_NAME -replace '^v', ''
            $extra += "--build-name=$name"
            $extra += "--build-number=$env:RUN_NUMBER"
            Write-Host "version from tag: $name+$env:RUN_NUMBER"
          } else {
            Write-Host "not a tag push: use version from pubspec.yaml"
          }
          flutter pub get
          flutter build windows --release @extra

      - name: 打包 zip
        run: |
          $src = 'build\windows\x64\runner\Release'
          if (-not (Test-Path $src)) { throw "build output missing: $src" }
          $ver = if ($env:REF_NAME -match '^v?\d+\.\d+\.\d+') { $env:REF_NAME -replace '^v', '' } else { 'dev' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist\ws_scrcpy_client-$ver-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "packed: $zip ($mb MB)"

      - name: 上传产物
        uses: actions/upload-artifact@v3
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ── 附：自动发 Release？先配好 token 再取消注释 ────────────────────────
